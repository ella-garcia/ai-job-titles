# Weekly job-board pull. Live boards only show today's roles, so every missed week is lost.
# Snapshots are committed to the `data` branch of this repo, which shares no history with `main`.
# Keep this repo private while the data branch exists: it holds scraped posting text.
name: weekly-pull
on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch: {}          # run by hand: Actions tab -> weekly-pull -> Run workflow
permissions:
  contents: write
concurrency: weekly-pull

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the code (main)
        uses: actions/checkout@v4
      - name: Check out the snapshots (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: .snapshots
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Pull boards and big employers
        env:
          AJT_DATA: ${{ github.workspace }}/.snapshots/snapshots
        run: |
          uv run python -m pipeline boards
          uv run python -m pipeline employers
      - name: Commit the snapshot to the data branch
        working-directory: .snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots          # the data branch's .gitignore leaves out runs/ and cache/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Weekly pull $(date -u +%F)"
          git push origin HEAD:data
