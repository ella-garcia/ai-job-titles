# Weekly job-board pull. Live boards only show today's roles, so every missed week is lost.
# Snapshots are committed to the `data` branch of this repo, which shares no history with `main`.
# Keep this repo private while the data branch exists: it holds scraped posting text.
name: weekly-pull
on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch: {}          # run by hand: Actions tab -> weekly-pull -> Run workflow
permissions:
  contents: write
concurrency: weekly-pull

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 200          # boards ~5 min + employers 110 + second pass 45 + commits
    steps:
      - name: Check out the code (main)
        uses: actions/checkout@v4
      - name: Check out the snapshots (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: .snapshots
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # Boards are committed before the big employers start: Workday sites rate-limit GitHub's runners, and
      # on 2026-11-16 the employers step ran past the job's time limit, so nothing at all was saved.
      - name: Pull boards
        env:
          AJT_DATA: ${{ github.workspace }}/.snapshots/snapshots
        run: uv run python -m pipeline boards
      - name: Commit the boards to the data branch
        working-directory: .snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots          # the data branch's .gitignore leaves out runs/ and cache/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Weekly pull $(date -u +%F): boards"
          git push origin HEAD:data
      - name: Pull big employers (time-boxed; finished employers are saved as they complete)
        timeout-minutes: 110
        continue-on-error: true
        env:
          AJT_DATA: ${{ github.workspace }}/.snapshots/snapshots
        run: uv run python -m pipeline employers
      - name: Second pass for rate-limited employers (resumes where they stopped)
        timeout-minutes: 45
        continue-on-error: true
        env:
          AJT_DATA: ${{ github.workspace }}/.snapshots/snapshots
        run: |
          if ls "$AJT_DATA"/raw/employers/*/*.progress.json >/dev/null 2>&1; then
            echo "Some employers stopped early; waiting 15 minutes, then resuming"
            sleep 900
            uv run python -m pipeline employers
          else
            echo "All employers finished"
          fi
      - name: Commit the employers to the data branch
        if: always()
        working-directory: .snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Weekly pull $(date -u +%F): big employers"
          git push origin HEAD:data
