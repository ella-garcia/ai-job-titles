# All project parameters. Code reads from here; no magic numbers in modules.
repo: ella-garcia/ai-job-titles      # used in the User-Agent we send to job sites
seed: 42

periods:                              # P0 pre-ChatGPT, P1 first wave, P2 deployment wave
  P0: ['2010-01-01', '2022-11-29']
  P1: ['2022-11-30', '2024-12-31']
  P2: ['2025-01-01', '2099-12-31']

# Role families: first matching pattern wins, so order matters. Case-insensitive.
families:
  # "Forward deployed" titles whose role is not an FDE (protocol v4). Decided by the title's role word, not by
  # industry words ("FDE, Legal" is an FDE). Both groups are tracked over time and left out of every test.
  # fd_nontech: non-technical roles (banker, accountant, recruiter, finance engineer, marketing, GRC).
  fd_nontech: '^(?!.*(forward[- ]deployed (software |ai |ml |data |security |infrastructure |frontend |backend |full[- ]stack |platform |solutions? |research )?(engineer|developer|architect|scientist|strategist)s?\b)).*(forward[- ]deployed.*\b(accountant|banker|investor|recruit\w*|talent|communications manager|marketing|sales development|finance engineer|counsel|lawyer|attorney|people partner|grc|assurance)\b|\b(accountant|banker|investor|recruit\w*|talent|communications manager|marketing|sales development|finance engineer|counsel|lawyer|attorney|people partner|grc|assurance)\b.*forward[- ]deployed)'
  # fd_hybrid: roles a title cannot settle (PM, program/engagement manager, consultant, enablement, analyst);
  # judged by their requirements only in exploratory work, never used to define FDE for Q1 (that would be circular).
  fd_hybrid: '^(?!.*(forward[- ]deployed (software |ai |ml |data |security |infrastructure |frontend |backend |full[- ]stack |platform |solutions? |research )?(engineer|developer|architect|scientist|strategist)s?\b)).*(forward[- ]deployed.*\b(product manager|program manager|engagement manager|consultant|enablement|analyst|accelerator|operations|designer|business development)\b|\b(product manager|program manager|engagement manager|consultant|enablement|analyst|accelerator|operations|designer|business development)\b.*forward[- ]deployed)|^(?!.*(engineer|developer|architect|software|scientist|research|technical|strateg|\bml\b|\bai\b)).*forward[- ]deployed'
  fde: 'forward[- ]deployed|deployment strateg|(agent|ai) deployment engineer|^deployed engineer'
  # Post-sales delivery roles (Q1 protocol v2): checked before sa_ce, so delivery/resident SAs land here.
  tech_consultant: 'technical consultant|consultor[a]? t[eé]cnic|professional services|implementation (engineer|consultant|specialist)|(delivery|resident) solutions? architect'
  sa_ce: 'solutions? architect|customer engineer|solutions? engineer|arquitect[oa]s?(/a)? de soluciones|preventa|pre-?sales|sales engineer'
  ai_pm: '\bai\b.*product manager|product manager.*\bai\b'
  pm: 'product manager'
  designer: '(product|ux) designer|design engineer'
  so_gtm: 'gtm engineer|strategy (&|and) operations|revops|revenue operations'
  legal: 'legal engineer|legal operations|legal ops'
  prompt: 'prompt engineer'
  # Kept in v1 (DEVELOPER_NOTES §11): big-employer / consulting AI hiring is in-scope for title counts.
  ai_eng: '\b(ai|ml|llm|genai|machine learning)\b.*engineer|ingenier[oa](/a)?.*\b(ia|inteligencia artificial|machine learning)\b'
  ai_consultant: '\b(ai|genai|generative ai|machine learning)\b.*consultant|consultant.*\b(ai|genai)\b|consultor[a]?(/a)?.*\b(ia|inteligencia artificial)\b'

# Hand labels for titles the seed regexes leave as other (from JobBERT + HDBSCAN clusters).
family_overrides_path: pipeline/family_overrides.csv

title_clustering:
  model: TechWolf/JobBERT-v2
  min_cluster_size: 10
  rapidfuzz_ratio: 92

golden_set:
  n: 150

# Q4 AI-intensity (skills layer for the paper). threshold: set after golden ai_bullet labelling.
ai_intensity:
  model: sentence-transformers/all-MiniLM-L6-v2
  threshold: null
  min_recall: 0.5

# Titles that match a family pattern but are a different job: labelled 'other' before families are tried.
# Hardware, chip and facilities "design engineers" (Nvidia, Amazon data centers) are not product designers.
# Hardware "forward deployed" roles (Saronic, Anduril build/production) are not FDE software roles.
exclude_titles: '\b(asic|chip|circuit|physical|mask|mixed[- ]signal|analog|rfic|rf|sram|mechanical|electrical|controls|layout|rtl|fpga|silicon|hardware|packaging|power|civil|structural|hvac|optical|thermal)\b.*design engineer|data center design|design engineering\b|\b(mechanical|electrical|hardware|build)\b.*forward deployed|forward deployed (build|production)\b|forward deployed.*\b(mechanical|electrical|hardware) engineer'

spain_pattern: 'spain|españa|madrid|barcelona|valencia|m[aá]laga|sevilla|seville|bilbao|, es\b|\bes\)'

